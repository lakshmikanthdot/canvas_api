<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advance Drawing App</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    <script defer src="script.js"></script>
</head>
<body>
    <div class="container">
        <section class="tools">
            <div class="row">
                <label class="title"><strong>Tools</strong></label>
                <ul class="options">
                    <li class="option">
                        <input type="range" id="sizeSlider" min="1" max="30" value="5">
                    </li>
                    <li class="option active tool" id="pencil" >
                        <i class="fa fa-pencil" id="icon"></i>
                    </li>
                    <li class="option tool" id="brush">
                        <i class="fa fa-paint-brush" id="icon"></i>
                    </li>
                    <li class="option tool" id="eraser">
                        <i class="fa fa-eraser" id="icon"></i>
                    </li>
                    <li class="option tool" id="undo">
                        <i class="fa fa-undo" id="icon"></i>
                    </li>
                    <li class="option tool" id="redo">
                        <i class="fa fa-redo" id="icon"></i>
                    </li>
                </ul>
            </div>
        </section>
        <section class="drawingArea"></section>
    </div>
</body>
</html>
